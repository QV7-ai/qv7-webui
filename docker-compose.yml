name: qv7

services:
  qv7:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      DATABASE_URL: /data/wlfv-ai.db
      UPLOADS_DIR: /uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
